<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noinex, nofollow">
    <meta name="description" content="JavaScriptの課題作品です。">
    <link rel="stylesheet" href="css/style.css">
    <title>お問い合わせ | my_shop</title>
</head>

<body id="up" class="sub-page">
    <header class="hat">
        <div class="container">
            <div class="wrapper">
                <h1><a href="index.html">🛒my_shop</a></h1>
                <p class="description">お気軽にご連絡ください</p>
            </div>
            <div class="hamburger" id="open_nav"><span aria-hidden="true">☰</span></div>
        </div>
    </header>

    <main class="page-content">
        <section class="page-heading">
            <p class="eyebrow">CONTACT</p>
            <h2>お問い合わせ</h2>
            <p>香りについてのご質問やご感想をお聞かせください。</p>
        </section>
        <form class="contact-form" action="#" method="post">
            <label for="name">お名前</label>
            <input type="text" id="name" name="name" autocomplete="name" required>

            <label for="email">メールアドレス</label>
            <input type="email" id="email" name="email" autocomplete="email" required>

            <label for="subject">件名</label>
            <select id="subject" name="subject">
                <option value="scent">香りについて</option>
                <option value="brand">ブランドについて</option>
                <option value="other">その他</option>
            </select>

            <label for="message">お問い合わせ内容</label>
            <textarea id="message" name="message" rows="7" required></textarea>

            <button type="submit">送信する</button>
        </form>
        <div class="up" aria-hidden="true">
            <a href="#up" aria-label="ページトップへ戻る">
                <img src="top_logo.jpg" alt="ページトップへ戻る">
            </a>
        </div>
    </main>

    <footer>
        <div class="footer-content"><small>&copy; 2026 my_shop. All rights reserved.</small></div>
    </footer>

    <nav id="nav">
        <div class="logo"><img src="perfume-shop.svg" alt="my_shop"></div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="next.html">next-page</a></li>
            <li><a href="kaori.html">香り一覧</a></li>
            <li><a href="brand.html">ブランド</a></li>
            <li><a href="contact.html">お問い合わせ</a></li>
        </ul>
    </nav>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
